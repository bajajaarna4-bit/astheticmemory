packages:
  - "apps/*"
  - "packages/*"

# pnpm >= 10 blocks lifecycle scripts by default. These packages genuinely need
# them (native binaries / engine downloads), so they are explicitly allowed.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "sharp"
  - "unrs-resolver"

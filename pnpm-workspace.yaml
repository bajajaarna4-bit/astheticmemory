packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks lifecycle scripts by default. These packages genuinely need them
# (native binaries / engine downloads), so they are explicitly allowed.
#
# `onlyBuiltDependencies` is the pnpm 9/10 spelling and is ignored from pnpm 11
# onwards; the current setting is `allowBuilds`, a package -> boolean map. With
# the old key a fresh install aborts with ERR_PNPM_IGNORED_BUILDS, which is what
# broke the first Vercel build. Keep the map in sync with the pnpm version pinned
# in the root package.json.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "prisma": true
  "esbuild": true
  "sharp": true
  "unrs-resolver": true

# The pnpm 9/10 spelling of the same allowlist. pnpm 11+ ignores this key and
# reads `allowBuilds`; older versions do the reverse, so a host running either
# version gets the same set approved.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "sharp"
  - "unrs-resolver"
